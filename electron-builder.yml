# Builds the installers: an AppImage on Linux, a setup program on Windows and a disk image on
# macOS. The dashboard is installed on its own; on first start it asks where KytyPS5 is.
appId: io.github.at0mc3.kytyps5-dashboard
productName: KytyPS5 Dashboard
artifactName: KytyPS5-Dashboard-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/**
  - package.json
asar: true
# Licences: this project (GPL-2.0) and the bundled Inter font (OFL).
extraResources:
  - from: LICENSE
    to: LICENSES/KytyPS5-Dashboard-GPL-2.0.txt
  - from: LICENSES
    to: LICENSES
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
linux:
  # The AppImage's start script adds --no-sandbox where Chromium's sandbox cannot work (no
  # unprivileged user namespaces, such as Ubuntu 24.04's AppArmor setting).
  target: AppImage
  # Windows and macOS name the program after productName (KytyPS5 Dashboard.exe / .app).
  executableName: kytyps5-dashboard
  category: Game
  icon: resources/icon.png
  synopsis: Console-style launcher for the KytyPS5 emulator
win:
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  # x86_64 like the emulator, which runs under Rosetta on Apple silicon.
  target:
    - target: dmg
      arch: x64
  icon: resources/icon.png
  category: public.app-category.games
  # Ad-hoc signature only; the app is not notarized, so the hardened runtime is not needed.
  identity: '-'
  hardenedRuntime: false
