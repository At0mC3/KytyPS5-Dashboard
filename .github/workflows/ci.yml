name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # Pushing a v* tag publishes a release with the three installers.
    tags: [ 'v*' ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            installer: AppImage
          - name: Windows
            os: windows-2022
            installer: exe
          - name: macOS
            os: macos-15
            installer: dmg
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xvfb

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the installer
        run: |
          npm run package
          ls -l dist

      - name: Check the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          appimage="$(ls dist/*.AppImage)"
          (cd dist && "./$(basename "$appimage")" --appimage-extract > /dev/null)
          run() { xvfb-run -a dist/squashfs-root/AppRun --self-test | grep '^{"emulator"' | tee "$1"; }
          # First start: no KytyPS5 folder chosen yet, so the app asks for it.
          KYTY_USER_DATA="$RUNNER_TEMP/first-start" run first-start.json
          grep -q '"emulatorSetup":{"source":"none"}' first-start.json
          # With the folder saved, the app finds the emulator and asks it for its devices.
          mkdir -p "$RUNNER_TEMP/saved"
          printf '{ "emulatorLocation": "%s" }\n' "$PWD/test/fake-emulator" > "$RUNNER_TEMP/saved/dashboard.json"
          KYTY_USER_DATA="$RUNNER_TEMP/saved" run saved.json
          grep -q '"queryAvailable":true' saved.json
          rm -rf dist/squashfs-root

      - name: Check the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\*.exe | Select-Object -First 1
          # NSIS wants /D last and without quotes, so use a folder without spaces.
          $target = Join-Path $env:RUNNER_TEMP 'KytyPS5Dashboard'
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$target" -Wait
          if (-not (Test-Path (Join-Path $target 'KytyPS5 Dashboard.exe'))) { Get-ChildItem $target; throw 'The installer did not install KytyPS5 Dashboard.exe' }

      - name: Check the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg="$(ls dist/*.dmg)"
          mount="$(hdiutil attach -nobrowse -readonly "$dmg" | tail -n 1 | cut -f 3)"
          app="$mount/KytyPS5 Dashboard.app"
          test -d "$app"
          for binary in "$app"/Contents/MacOS/*; do
            lipo "$binary" -verify_arch x86_64
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil detach "$mount"

      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test
          # The GPU-rendered background, through SwiftShader on the runner.
          KYTY_E2E_SWIFTSHADER=1 xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test smoke
          KYTY_E2E_SIZE=1080 KYTY_E2E_SWIFTSHADER=1 xvfb-run -a -s "-screen 0 1920x1200x24" npx playwright test tour

      - name: Upload screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Dashboard-screenshots
          path: test-results/screenshots/**
          if-no-files-found: ignore

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Dashboard-${{ matrix.name }}
          path: dist/*.${{ matrix.installer }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: KytyPS5-Dashboard-{Linux,Windows,macOS}
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          test "$(ls artifacts | wc -l)" -eq 3
          # The release may already exist when it was created on GitHub together with the tag.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "KytyPS5 Dashboard $GITHUB_REF_NAME" \
              --generate-notes
          fi
